name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install & build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Assemble site (web app at site root)
        run: |
          mkdir -p _site
          cp -R web/dist/. _site/
          # Keep ads / image files that external apps link to at site root
          for f in CNAME app-ads.txt App_ads.txt defaull_avatar.png qtr_banner.jpeg; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          # GitHub Pages serves ONLY site-root 404.html for missing paths (SPA deep links)
          cp web/spa-404-root.html _site/404.html
          # Belt-and-suspenders: ensure Strava OAuth callback is a real directory index
          mkdir -p _site/strava/callback
          cp web/dist/index.html _site/strava/callback/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
