<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QTR Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Restore deep link after GitHub Pages root 404.html bounce
      ;(function () {
        try {
          var redirect = sessionStorage.getItem('qtr-spa-redirect')
          if (!redirect) return
          sessionStorage.removeItem('qtr-spa-redirect')
          // Old links under /qtrchallenge/web/… now live at /qtrchallenge/…
          redirect = redirect.replace(/^\/qtrchallenge\/web(?=\/|\?|#|$)/, '/qtrchallenge')
          if (redirect.indexOf('/qtrchallenge') === 0) {
            history.replaceState(null, '', redirect)
          }
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
