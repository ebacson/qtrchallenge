<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" id="app-manifest" href="/manifest.webmanifest" />
    <script>
      // Android: cài được như app toàn màn hình. iOS giữ display "browser" để OAuth Strava chạy trong Safari.
      if (/Android/i.test(navigator.userAgent)) {
        document.getElementById('app-manifest').href = '/manifest-android.webmanifest'
      }
    </script>
    <meta name="theme-color" content="#d0102b" />
    <meta name="apple-mobile-web-app-title" content="QTR" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QTR Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Restore deep link after GitHub Pages root 404.html bounce
      ;(function () {
        try {
          var redirect = sessionStorage.getItem('qtr-spa-redirect')
          if (!redirect) return
          sessionStorage.removeItem('qtr-spa-redirect')
          // Old links under /qtrchallenge/… and /web/… now live at the site root
          redirect = redirect
            .replace(/^\/qtrchallenge(?=\/|\?|#|$)/, '')
            .replace(/^\/web(?=\/|\?|#|$)/, '')
          if (redirect.charAt(0) !== '/') redirect = '/' + redirect
          history.replaceState(null, '', redirect)
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
